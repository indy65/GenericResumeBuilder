<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f1f5f9;--surf:#fff;--surf2:#f8fafc;--bdr:#e2e8f0;
  --txt:#0f172a;--muted:#64748b;--faint:#94a3b8;
  --acc:#4f46e5;--acc-l:rgba(79,70,229,.08);
  --sh:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05);
  --sh-md:0 4px 16px rgba(0,0,0,.10);--sh-lg:0 8px 32px rgba(0,0,0,.14);
}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;font-size:14px}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}
/* LAYOUT */
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.header{display:flex;align-items:center;gap:10px;padding:0 18px;height:54px;background:var(--surf);border-bottom:1px solid var(--bdr);flex-shrink:0;box-shadow:var(--sh);z-index:50}
.hbrand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;letter-spacing:-.4px}
.hlogo{font-size:22px;color:var(--acc)}
.hbrand span{color:var(--acc)}
.hctr{flex:1;display:flex;justify-content:center;align-items:center;gap:6px;font-size:11.5px;color:var(--faint);font-weight:500}
.saved-dot{width:6px;height:6px;border-radius:50%;background:#22c55e}
.hacts{display:flex;align-items:center;gap:6px}
.mob-tabs{display:none;background:var(--surf);border-bottom:1px solid var(--bdr);flex-shrink:0}
.mob-tab{flex:1;padding:11px;font-size:14px;font-weight:600;border:none;background:transparent;color:var(--muted);border-bottom:2px solid transparent;transition:all .15s}
.mob-tab.on{color:var(--acc);border-bottom-color:var(--acc)}
.main{display:flex;flex:1;overflow:hidden}
/* SIDEBAR */
.sidebar{width:210px;flex-shrink:0;background:var(--surf);border-right:1px solid var(--bdr);overflow-y:auto;padding:12px 8px 80px;display:flex;flex-direction:column;gap:1px}
.sg{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--faint);padding:10px 10px 4px}
.nav-btn{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:500;border:none;background:transparent;color:var(--muted);width:100%;text-align:left;transition:all .12s}
.nav-btn:hover{background:var(--surf2);color:var(--txt)}
.nav-btn.on{background:var(--acc-l);color:var(--acc);font-weight:600}
.nav-icon{width:18px;text-align:center}
/* COMPLETENESS */
.comp{background:var(--surf2);border-radius:9px;padding:11px 12px;margin:0 2px 12px;border:1px solid var(--bdr)}
.comp-hdr{display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px}
.comp-bar{height:5px;background:var(--bdr);border-radius:10px;overflow:hidden}
.comp-fill{height:100%;border-radius:10px;transition:width .5s,background .5s}
.comp-hints{margin-top:8px;display:flex;flex-direction:column;gap:3px;font-size:10.5px;color:var(--muted)}
/* EDITOR */
.editor{width:380px;flex-shrink:0;overflow-y:auto;background:var(--bg);border-right:1px solid var(--bdr)}
.ed-inner{padding:22px 20px 60px}
.sec-head{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--bdr)}
.sec-desc{font-size:12.5px;color:var(--muted);margin-bottom:16px;margin-top:-10px;line-height:1.5}
/* FORMS */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg{margin-bottom:13px}
.fl{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.req{color:#ef4444;margin-left:2px}
.fi{width:100%;padding:8px 11px;border:1.5px solid var(--bdr);border-radius:8px;font-size:13.5px;color:var(--txt);background:var(--surf);outline:none;transition:border-color .15s,box-shadow .15s;appearance:none;-webkit-appearance:none}
.fi:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.fi.err{border-color:#ef4444}
.ferr{font-size:11px;color:#ef4444;margin-top:3px}
.fta{width:100%;padding:8px 11px;border:1.5px solid var(--bdr);border-radius:8px;font-size:13.5px;color:var(--txt);background:var(--surf);outline:none;resize:vertical;line-height:1.55;transition:border-color .15s,box-shadow .15s}
.fta:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.char-ct{font-size:11px;color:var(--faint);text-align:right;margin-top:3px}
.cbl{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:12px;cursor:pointer;user-select:none}
.cbl input{width:15px;height:15px;accent-color:var(--acc)}
/* TAGS */
.tag-box{display:flex;flex-wrap:wrap;gap:5px;padding:6px 8px;border:1.5px solid var(--bdr);border-radius:8px;background:var(--surf);min-height:42px;align-items:center;transition:border-color .15s;cursor:text}
.tag-box:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.tag{display:inline-flex;align-items:center;gap:3px;background:var(--acc-l);color:var(--acc);padding:3px 9px 3px 10px;border-radius:20px;font-size:12px;font-weight:500}
.tag-x{background:none;border:none;color:var(--acc);font-size:15px;line-height:1;padding:0 1px;opacity:.55;cursor:pointer}
.tag-x:hover{opacity:1}
.tag-fi{border:none;outline:none;font-size:13px;min-width:110px;flex:1;background:transparent;color:var(--txt)}
.tag-fi::placeholder{color:var(--faint)}
/* ENTRY CARDS */
.ecard{background:var(--surf);border:1.5px solid var(--bdr);border-radius:10px;margin-bottom:8px;box-shadow:var(--sh);transition:box-shadow .15s}
.ecard:hover{box-shadow:var(--sh-md)}
.ecard-hdr{display:flex;align-items:center;gap:8px;padding:11px 13px}
.ecard-info{flex:1;min-width:0}
.ecard-title{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ecard-sub{font-size:11.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ecard-acts{display:flex;gap:3px;align-items:center;flex-shrink:0}
.dh{color:#cbd5e1;padding:5px 4px;font-size:14px;border-radius:5px;display:flex;align-items:center;justify-content:center;cursor:grab;transition:color .15s;border:none;background:transparent}
.dh:hover{color:var(--muted);background:var(--surf2)}
.badge{font-size:10px;background:var(--acc-l);color:var(--acc);padding:2px 7px;border-radius:10px;font-weight:600;flex-shrink:0}
/* AVATAR */
.av-drop{border:2px dashed var(--bdr);border-radius:12px;padding:26px 20px;text-align:center;cursor:pointer;margin-bottom:18px;transition:all .2s;background:var(--surf)}
.av-drop:hover,.av-drop.over{border-color:var(--acc);background:var(--acc-l)}
.av-wrap{display:flex;align-items:center;gap:16px;margin-bottom:18px;padding:13px 14px;background:var(--surf);border:1.5px solid var(--bdr);border-radius:12px}
.av-img{width:68px;height:68px;border-radius:50%;object-fit:cover;border:2px solid var(--bdr)}
.av-acts{display:flex;gap:8px;flex-direction:column}
/* BUTTONS */
.btn-p{background:var(--acc);color:#fff;border:none;padding:9px 18px;border-radius:8px;font-size:13.5px;font-weight:600;transition:opacity .15s;white-space:nowrap}
.btn-p:hover{opacity:.88}.btn-p:disabled{opacity:.4;cursor:not-allowed}
.btn-g{background:transparent;color:var(--txt);border:1.5px solid var(--bdr);padding:9px 16px;border-radius:8px;font-size:13.5px;font-weight:500;transition:background .12s;white-space:nowrap}
.btn-g:hover{background:var(--surf2)}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:7px;border:1.5px solid var(--bdr);background:var(--surf);font-weight:500;color:var(--txt);transition:background .12s;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.btn-sm:hover{background:var(--surf2)}
.btn-sm.dng{color:#ef4444;border-color:#fecaca}.btn-sm.dng:hover{background:#fef2f2}
.btn-icon{background:none;border:none;font-size:15px;padding:4px 6px;border-radius:6px;transition:background .12s;line-height:1}
.btn-icon:hover{background:var(--surf2)}
.btn-add{width:100%;padding:9px;margin-top:6px;border:1.5px dashed var(--bdr);border-radius:9px;background:transparent;color:var(--acc);font-size:13px;font-weight:600;transition:all .15s}
.btn-add:hover{background:var(--acc-l);border-color:var(--acc)}
.btn-gs{background:transparent;border:none;color:var(--acc);font-size:12px;font-weight:600;padding:3px 6px;border-radius:5px}
.btn-gs:hover{background:var(--acc-l)}
.btn-ds{background:#ef4444;color:#fff;border:none;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600}
.btn-ism{background:var(--surf);border:1.5px solid var(--bdr);padding:5px 10px;border-radius:7px;font-size:13px;color:var(--txt);transition:background .12s}
.btn-ism:hover{background:var(--surf2)}
/* MODAL */
.modal-ov{position:fixed;inset:0;background:rgba(15,23,42,.4);display:flex;align-items:flex-start;justify-content:center;padding:56px 16px 32px;z-index:200;overflow-y:auto;backdrop-filter:blur(2px)}
.modal-ov.hide{display:none}
.modal{background:var(--surf);border-radius:14px;width:100%;max-width:580px;box-shadow:var(--sh-lg);animation:min .18s ease}
@keyframes min{from{opacity:0;transform:translateY(-10px) scale(.97)}to{opacity:1;transform:none}}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 14px;border-bottom:1px solid var(--bdr)}
.modal-title{font-size:15.5px;font-weight:700}
.modal-body{padding:20px;max-height:72vh;overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--bdr)}
.bull-row{display:flex;gap:6px;margin-bottom:7px;align-items:center}
.bull-num{font-size:11px;color:var(--faint);min-width:16px;text-align:right}
/* TOGGLE */
.tog{position:relative;display:inline-block;width:36px;height:21px;flex-shrink:0}
.tog input{opacity:0;width:0;height:0}
.tsl{position:absolute;inset:0;background:#cbd5e1;border-radius:21px;cursor:pointer;transition:background .2s}
.tsl::before{content:'';position:absolute;width:15px;height:15px;background:#fff;border-radius:50%;left:3px;top:3px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tog input:checked+.tsl{background:var(--acc)}
.tog input:checked+.tsl::before{transform:translateX(15px)}
/* SECTION ORDER */
.so-row{display:flex;align-items:center;gap:10px;padding:10px 11px;background:var(--surf);border:1.5px solid var(--bdr);border-radius:9px;margin-bottom:6px;font-size:13px;font-weight:500;transition:box-shadow .15s;cursor:default}
.so-row.dragging-over{box-shadow:0 0 0 2px var(--acc);background:var(--acc-l)}
/* TEMPLATE CARDS */
.tpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tpl-card{padding:13px 12px;border:2px solid var(--bdr);border-radius:11px;background:var(--surf);text-align:left;transition:all .15s}
.tpl-card:hover{border-color:#a5b4fc}
.tpl-card.on{border-color:var(--acc);background:var(--acc-l)}
.tpl-name{font-size:13px;font-weight:700;margin-bottom:4px}
.tpl-desc{font-size:11.5px;color:var(--muted);line-height:1.4}
.tpl-thumb{height:52px;border-radius:6px;margin-bottom:10px;border:1px solid var(--bdr);overflow:hidden;display:flex;background:var(--surf2)}
/* SWATCHES */
.swatch{width:30px;height:30px;border-radius:50%;border:3px solid transparent;transition:transform .15s}
.swatch:hover{transform:scale(1.15)}
.swatch.on{border-color:#0f172a!important}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* DIVIDER */
.divider{border:none;border-top:1px solid var(--bdr);margin:18px 0}
/* CUST */
.cust-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:10px}
/* ATS NOTE */
.ats-note{margin-top:16px;padding:13px 14px;background:#fefce8;border:1.5px solid #fde68a;border-radius:9px;font-size:12.5px;color:#78350f;line-height:1.55}
/* PREVIEW */
.preview-panel{flex:1;overflow:hidden;display:flex;flex-direction:column;background:#dde3eb}
.prev-toolbar{display:flex;align-items:center;justify-content:space-between;padding:9px 16px;background:var(--surf);border-bottom:1px solid var(--bdr);flex-shrink:0;gap:12px}
.prev-tl{display:flex;align-items:center;gap:6px}
.prev-tr{display:flex;align-items:center;gap:8px}
.zoom-lbl{font-size:12px;font-weight:600;color:var(--muted);min-width:34px;text-align:center}
.prev-tpl-lbl{font-size:12px;color:var(--muted);font-weight:500}
.prev-scroll{flex:1;overflow-y:auto;padding:28px 28px 60px;display:flex;justify-content:center;align-items:flex-start}
.prev-wrap{transform-origin:top center;transition:transform .12s}
/* RESUME PAGE */
.rpage{background:#fff;width:794px;min-height:1122px;box-shadow:0 4px 28px rgba(0,0,0,.16)}
/* EXTRA LINK */
.el-row{display:flex;gap:6px;margin-bottom:7px}
/* RESPONSIVE */
@media(max-width:1100px){.sidebar{width:185px}.editor{width:340px}}
@media(max-width:900px){.mob-tabs{display:flex}.preview-panel{display:none!important}.sidebar{width:185px}.editor{width:calc(100% - 185px)}}

/* ── MOBILE (≤640px) ─────────────────────────────────────────── */
@media(max-width:640px){
  /* Layout: hide desktop sidebar, full-width editor */
  .sidebar{display:none!important}
  .editor{width:100%!important;border-right:none!important}
  .g2{grid-template-columns:1fr}
  .ed-inner{padding:16px 14px 100px}

  /* Header */
  .header{padding:0 12px!important;height:50px!important}
  .hbrand{font-size:14px!important}
  /* Hide all header action buttons except PDF */
  .hacts .btn-sm{display:none!important}
  .hacts .btn-p{padding:6px 14px!important;font-size:13px!important}
  /* Show undo/redo as icon-only */
  #btn-undo,#btn-redo{display:inline-flex!important;padding:6px 9px!important;font-size:16px!important}
  /* Hide saved indicator text on mobile */
  .hctr{display:none!important}

  /* Top tabs (Editor / Preview): hide — replaced by bottom nav */
  .mob-tabs{display:none!important}

  /* Action bar + section scroll bar below header */
  .mob-action-bar{display:flex!important}
  .mob-section-bar{display:flex!important}
  .mob-section-btn{padding:10px 12px!important;font-size:12px!important}

  /* Inputs: prevent iOS zoom */
  .fi,.fta,.tag-fi{font-size:16px!important}

  /* Touch targets */
  .btn-add{padding:13px!important;font-size:14px!important}
  .btn-icon{padding:9px!important;font-size:18px!important}
  .ecard-hdr{padding:14px!important}
  .ecard-title{font-size:14.5px!important}
  .tag{font-size:13px!important;padding:5px 11px 5px 10px!important}
  .tag-x{font-size:18px!important}

  /* Modals: slide up from bottom */
  .modal-ov{padding:0!important;align-items:flex-end!important}
  .modal{border-radius:20px 20px 0 0!important;max-width:100%!important;width:100%!important;max-height:90vh;overflow-y:auto}
  .modal-body{max-height:65vh!important}

  /* Preview toolbar simplified */
  .margin-ctrl{display:none!important}
  .prev-toolbar{padding:8px 12px!important;flex-wrap:wrap;gap:6px!important}

  /* Completeness bar: show compact in editor header area */
  .comp{display:block!important;margin:0 0 12px;border-radius:8px}

  /* Section head: tighter */
  .sec-head{font-size:15px!important;margin-bottom:14px!important}
}

/* ── BOTTOM NAV (mobile only) ───────────────────────────────── */
.mob-bottom-nav{
  display:none;
  position:fixed;bottom:0;left:0;right:0;
  height:60px;
  background:var(--surf);
  border-top:1px solid var(--bdr);
  z-index:150;
  box-shadow:0 -2px 12px rgba(0,0,0,.08);
}
.mob-bottom-nav-inner{
  display:flex;align-items:stretch;height:100%;
}
.mob-bn-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;border:none;background:transparent;color:var(--muted);
  font-size:10px;font-weight:600;cursor:pointer;transition:color .15s;
  padding:6px 4px 8px;
}
.mob-bn-btn.on{color:var(--acc)}
.mob-bn-btn .bn-icon{font-size:20px;line-height:1}
.mob-bn-btn.on .bn-icon{transform:scale(1.12);transition:transform .15s}

/* Floating preview button (shown when in preview tab on mobile) */
.mob-fab{
  display:none;
  position:fixed;bottom:72px;right:16px;z-index:160;
  background:var(--acc);color:#fff;border:none;
  border-radius:28px;padding:12px 20px;
  font-size:14px;font-weight:700;
  box-shadow:0 4px 20px rgba(0,0,0,.22);cursor:pointer;
  align-items:center;gap:8px;
}

@media(max-width:640px){
  .mob-bottom-nav{display:block}
  /* Extra bottom padding so content isn't hidden behind nav */
  .main{padding-bottom:60px}
  .preview-panel .prev-scroll{padding-bottom:80px!important}
}


/* Section picker bar - hidden on desktop, shown on mobile */
.mob-section-bar{display:none;overflow-x:auto;background:var(--surf);border-bottom:1px solid var(--bdr);flex-shrink:0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.mob-section-bar::-webkit-scrollbar{display:none}
.mob-section-btn{flex-shrink:0;padding:10px 14px;font-size:12px;font-weight:600;border:none;background:transparent;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;cursor:pointer;transition:color .15s,border-color .15s}
.mob-section-btn.on{color:var(--acc);border-bottom-color:var(--acc)}
/* ── MOBILE ACTION BAR ─────────────────────────────────────────── */
.mob-action-bar{display:none;overflow-x:auto;background:var(--surf2);border-bottom:1px solid var(--bdr);flex-shrink:0;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:6px 10px;gap:6px}
.mob-action-bar::-webkit-scrollbar{display:none}
.mob-action-bar .btn-sm{flex-shrink:0;display:inline-flex!important;padding:6px 13px;font-size:12px;font-weight:600;white-space:nowrap}
.preview-panel.mob-show{display:flex!important}
.hide-mob{display:none!important}

/* RESUME MANAGER */
.rm-ov{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:400;padding:16px;backdrop-filter:blur(3px)}
.rm-ov.hide{display:none}
.rm-panel{background:var(--surf);border-radius:16px;width:100%;max-width:520px;box-shadow:var(--sh-lg);overflow:hidden;max-height:85vh;display:flex;flex-direction:column}
.rm-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 14px;border-bottom:1px solid var(--bdr)}
.rm-title{font-size:16px;font-weight:800;color:var(--txt)}
.rm-body{overflow-y:auto;padding:14px 22px;flex:1}
.rm-slot{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1.5px solid var(--bdr);border-radius:10px;margin-bottom:8px;transition:border-color .15s,background .15s}
.rm-slot.on{border-color:var(--acc);background:var(--acc)0a}
.rm-slot-name{flex:1;font-size:14px;font-weight:600;color:var(--txt)}
.rm-slot-name input{background:transparent;border:none;outline:none;font-size:14px;font-weight:600;color:var(--txt);width:100%;padding:2px 4px;border-radius:4px}
.rm-slot-name input:focus{background:var(--surf2);outline:2px solid var(--acc)}
.rm-slot-meta{font-size:11px;color:var(--faint)}
.rm-foot{padding:14px 22px;border-top:1px solid var(--bdr);display:flex;gap:8px}
.ob-ov{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:500;padding:16px;backdrop-filter:blur(3px)}
.ob-ov.hide{display:none}
.ob-modal{background:var(--surf);border-radius:18px;width:100%;max-width:480px;box-shadow:var(--sh-lg);overflow:hidden}
.ob-steps{display:flex;gap:0}
.ob-step{flex:1;height:3px;background:var(--bdr);transition:background .3s}
.ob-step.done{background:var(--acc)}
.ob-body{padding:32px 32px 24px}
.ob-icon{font-size:48px;margin-bottom:14px}
.ob-title{font-size:20px;font-weight:800;margin-bottom:8px;color:var(--txt)}
.ob-desc{font-size:14px;color:var(--muted);line-height:1.65;margin-bottom:24px}
.ob-foot{display:flex;align-items:center;justify-content:space-between;padding:16px 32px;border-top:1px solid var(--bdr)}
.ob-dots{display:flex;gap:6px}
.ob-dot{width:7px;height:7px;border-radius:50%;background:var(--bdr);transition:background .3s}
.ob-dot.on{background:var(--acc)}

@media print{
  .header,.sidebar,.editor,.mob-tabs{display:none!important}
  .main{overflow:visible}
  .preview-panel{display:block!important;position:fixed;inset:0;background:#fff;z-index:9999;overflow:visible}
  .prev-toolbar{display:none!important}
  .prev-scroll{overflow:visible;padding:0;background:#fff}
  .prev-wrap{transform:none!important;width:100%}
  .rpage{box-shadow:none;width:100%;min-height:unset}
  /* Page break controls */
  .pb-before{page-break-before:always!important;break-before:page!important}
  .pb-avoid{page-break-inside:avoid!important;break-inside:avoid!important}
  .pb-section{page-break-before:auto;break-before:auto}
}
/* Page break marker (visible in editor/preview, hidden on print) */
.pb-marker{display:flex;align-items:center;gap:8px;margin:10px 0;cursor:pointer;user-select:none}
.pb-marker-line{flex:1;border-top:2px dashed #93c5fd}
.pb-marker-label{font-size:10px;font-weight:600;color:#93c5fd;white-space:nowrap;background:#eff6ff;padding:2px 8px;border-radius:10px;border:1px dashed #93c5fd}
@media print{.pb-marker{display:none!important}}

<script>
'use strict';
// ─── PURE VANILLA JS RESUME BUILDER ────────────────────────────────────────
// Zero dependencies. Works from file:// on Windows, Mac, Linux.

// ── HELPERS ──────────────────────────────────────────────────────────────────
const gid=()=>Math.random().toString(36).slice(2,9);
const fmt=d=>{if(!d)return'';const[y,m]=d.split('-');const ms=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return m?`${ms[+m-1]} ${y}`:y;};
const h=(t,a,...c)=>{const el=document.createElement(t);if(a)Object.entries(a).forEach(([k,v])=>{if(k==='class')el.className=v;else if(k==='style'){if(typeof v==='string')el.style.cssText=v;else Object.entries(v).forEach(([sk,sv])=>el.style.setProperty(sk.replace(/([A-Z])/g,'-$1').toLowerCase(),sv));}else if(k.startsWith('on'))el.addEventListener(k.slice(2).toLowerCase(),v);else el.setAttribute(k,v);});c.forEach(ch=>{if(ch==null)return;if(typeof ch==='string'||typeof ch==='number')el.appendChild(document.createTextNode(String(ch)));else if(ch instanceof Node)el.appendChild(ch);else if(Array.isArray(ch))ch.forEach(c2=>c2 instanceof Node&&el.appendChild(c2));});return el;};
const qs=(sel,ctx=document)=>ctx.querySelector(sel);
const $=(id)=>document.getElementById(id);
const on=(el,ev,fn)=>el&&el.addEventListener(ev,fn);
const cls=(...c)=>c.filter(Boolean).join(' ');

// ── STATE ─────────────────────────────────────────────────────────────────────
const load=(k,fb)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch{return fb;}};
const KEYS={
  resumes:'rb1_resumes',  // [{id,name,data,template,accent,font,updatedAt}]
  active:'rb1_active',    // id of active slot
  // legacy keys (kept for migration only)
  data:'rb1_data',tpl:'rb1_tpl',acc:'rb1_acc',fnt:'rb1_fnt'
};

// ── MULTI-RESUME STORE ────────────────────────────────────────────────────────
function loadResumeStore(){
  // Try new multi-resume format first
  const slots=load(KEYS.resumes,null);
  if(slots&&slots.length){
    const activeId=load(KEYS.active,slots[0].id);
    const active=slots.find(s=>s.id===activeId)||slots[0];
    return {slots,activeId:active.id,active};
  }
  // Migrate from legacy single-resume format
  const legacyData=load(KEYS.data,null);
  const slot={
    id:gid(),name:'My Resume',
    data:legacyData||JSON.parse(JSON.stringify(EMPTY)),
    template:load(KEYS.tpl,'minimal'),
    accent:load(KEYS.acc,'#4F46E5'),
    font:load(KEYS.fnt,"'Inter',sans-serif"),
    updatedAt:new Date().toISOString()
  };
  return {slots:[slot],activeId:slot.id,active:slot};
}

function saveResumeStore(){
  const slots=state.slots.map(s=>
    s.id===state.activeId
      ?{...s,data:state.resume,template:state.template,accent:state.accent,font:state.font,updatedAt:new Date().toISOString()}
      :s
  );
  localStorage.setItem(KEYS.resumes,JSON.stringify(slots));
  localStorage.setItem(KEYS.active,state.activeId);
}

function switchResume(id){
  const slot=state.slots.find(s=>s.id===id);
  if(!slot)return;
  // Save current first
  saveResumeStore();
  // Apply migrations to loaded slot
  let data=JSON.parse(JSON.stringify(slot.data));
  data=migrateResumeData(data);
  Object.assign(state,{
    activeId:id,
    resume:data,
    template:slot.template||'minimal',
    accent:slot.accent||'#4F46E5',
    font:slot.font||"'Inter',sans-serif",
    history:[],historyIdx:-1
  });
  // Update active id in slots
  state.slots=state.slots; // unchanged
  localStorage.setItem(KEYS.active,id);
  pushHistory();
  scheduleSave();
  render();
}

function duplicateResume(id){
  const slot=state.slots.find(s=>s.id===id);
  if(!slot)return;
  // Save current data into the slot before duplicating
  const currentSlots=state.slots.map(s=>
    s.id===state.activeId
      ?{...s,data:state.resume,template:state.template,accent:state.accent,font:state.font,updatedAt:new Date().toISOString()}
      :s
  );
  const newSlot={
    id:gid(),
    name:(slot.name||'Resume')+' (copy)',
    data:JSON.parse(JSON.stringify(id===state.activeId?state.resume:slot.data)),
    template:id===state.activeId?state.template:slot.template||'minimal',
    accent:id===state.activeId?state.accent:slot.accent||'#4F46E5',
    font:id===state.activeId?state.font:slot.font||"'Inter',sans-serif",
    updatedAt:new Date().toISOString()
  };
  state.slots=[...currentSlots,newSlot];
  saveResumeStore();
  return newSlot;
}

function deleteResume(id){
  if(state.slots.length<=1){alert('You need at least one resume.');return;}
  state.slots=state.slots.filter(s=>s.id!==id);
  if(state.activeId===id){
    switchResume(state.slots[0].id);
  } else {
    saveResumeStore();
  }
}

function renameResume(id,name){
  state.slots=state.slots.map(s=>s.id===id?{...s,name}:s);
  saveResumeStore();
}

function newResume(){
  const currentSlots=state.slots.map(s=>
    s.id===state.activeId
      ?{...s,data:state.resume,template:state.template,accent:state.accent,font:state.font,updatedAt:new Date().toISOString()}
      :s
  );
  const slot={
    id:gid(),name:'New Resume',
    data:JSON.parse(JSON.stringify(EMPTY)),
    template:'minimal',accent:'#4F46E5',font:"'Inter',sans-serif",
    updatedAt:new Date().toISOString()
  };
  state.slots=[...currentSlots,slot];
  switchResume(slot.id);
}

// ── MIGRATION ─────────────────────────────────────────────────────────────────
function migrateResumeData(r){
  if(!r)return JSON.parse(JSON.stringify(EMPTY));
  if(!r.skillCategories||!r.skillCategories.length){
    const ec=Object.keys(r.skills||{}).filter(k=>(r.skills[k]||[]).length>0);
    r=Object.assign({},r,{skillCategories:ec.length?ec:[...DEFAULT_SKILL_CATS],skills:r.skills||{}});
  }
  if(!r.pageBreaks)r=Object.assign({},r,{pageBreaks:[]});
  if(r.personal&&r.personal.github){
    const p=Object.assign({},r.personal);
    if(!p.extraLinks)p.extraLinks=[];
    if(!p.extraLinks.find(l=>l.url===p.github))p.extraLinks=[{label:'GitHub',url:p.github},...p.extraLinks];
    delete p.github;r=Object.assign({},r,{personal:p});
  }
  if(r.personal&&typeof r.personal.avatar==='string'&&r.personal.avatar){
    r=Object.assign({},r,{personal:Object.assign({},r.personal,{avatar:{src:r.personal.avatar,offsetX:50,offsetY:50,zoom:1}})});
  }
  if(r.skills){
    const sk=Object.assign({},r.skills);let ch=false;
    Object.keys(sk).forEach(cat=>{
      if(sk[cat]&&sk[cat].length&&typeof sk[cat][0]==='string'){sk[cat]=sk[cat].map(s=>({name:s,level:''}));ch=true;}
    });
    if(ch)r=Object.assign({},r,{skills:sk});
  }
  return r;
}

// ── UNDO / REDO ───────────────────────────────────────────────────────────────
function pushHistory(){
  if(state.historyPaused)return;
  const snap=JSON.stringify(state.resume);
  // Don't push duplicate
  if(state.history.length>0&&state.history[state.historyIdx]===snap)return;
  // Truncate forward history on new change
  state.history=state.history.slice(0,state.historyIdx+1);
  state.history.push(snap);
  if(state.history.length>80)state.history.shift(); // cap at 80 steps
  state.historyIdx=state.history.length-1;
}
function undo(){
  if(state.historyIdx<=0)return;
  state.historyIdx--;
  state.historyPaused=true;
  state.resume=JSON.parse(state.history[state.historyIdx]);
  state.historyPaused=false;
  scheduleSave();renderPreview();renderCompleteness();updateUndoRedoBtns();
  const edInner=$('ed-inner');
  rebuildEditorHeader();
}
function redo(){
  if(state.historyIdx>=state.history.length-1)return;
  state.historyIdx++;
  state.historyPaused=true;
  state.resume=JSON.parse(state.history[state.historyIdx]);
  state.historyPaused=false;
  scheduleSave();renderPreview();renderCompleteness();updateUndoRedoBtns();
  const edInner=$('ed-inner');
  rebuildEditorHeader();
}
function updateUndoRedoBtns(){
  const ub=$('btn-undo');const rb=$('btn-redo');
  if(ub)ub.disabled=state.historyIdx<=0;
  if(rb)rb.disabled=state.historyIdx>=state.history.length-1;
  if(ub)ub.style.opacity=state.historyIdx<=0?'0.35':'1';
  if(rb)rb.style.opacity=state.historyIdx>=state.history.length-1?'0.35':'1';
}

// ── COMPLETENESS ──────────────────────────────────────────────────────────────
function completeness(r){
  let s=0;const h=[];
  if(r.personal.name)s+=10;else h.push('Add your full name');
  if(r.personal.email)s+=5;else h.push('Add your email address');
  if(r.personal.linkedin)s+=5;else h.push('Add your LinkedIn profile');
  if(r.personal.title)s+=5;if(r.personal.avatar&&avatarSrc(r.personal.avatar))s+=5;if(r.personal.location)s+=3;if(r.personal.phone)s+=2;
  if(r.summary&&r.summary.length>50)s+=10;else h.push('Write a professional summary (50+ characters)');
  const sk=flatSkillCount(r.skills);
  if(sk>=8)s+=10;else if(sk>=3)s+=5;else h.push('Add at least 5 skills');
  if(r.experience.length>=2)s+=15;else if(r.experience.length===1)s+=8;else h.push('Add work experience');
  if(r.projects.length>=1)s+=10;else h.push('Add a project or portfolio item');
  if(r.education.length>=1)s+=8;else h.push('Add your education');
  if(r.certifications.length>=1)s+=5;
  return{score:Math.min(s,100),hints:h.slice(0,3)};
}

function mkTextarea(label,val,onChange,rows=4,maxLen){

// ── TAG INPUT ─────────────────────────────────────────────────────────────────
function mkTagInput(label,tags,onChange){
  const wrap=h('div',{class:'fg'});
  if(label)wrap.appendChild(h('label',{class:'fl'},label));
  const box=h('div',{class:'tag-box'});
  const fi=h('input',{class:'tag-fi',placeholder:'Type and press Enter'});
  const render=()=>{
    while(box.firstChild&&box.firstChild!==fi)box.removeChild(box.firstChild);
    tags.forEach(t=>{
      const tx=h('button',{class:'tag-x'},'×');
      on(tx,'click',()=>{tags=tags.filter(x=>x!==t);onChange(tags);render();});
      box.insertBefore(h('span',{class:'tag'},t,tx),fi);
    });
  };
  render();
  on(fi,'keydown',e=>{
    if(e.key==='Enter'||e.key===','){e.preventDefault();const v=fi.value.trim();if(v&&!tags.includes(v)){tags=[...tags,v];onChange(tags);render();}fi.value='';}
    if(e.key==='Backspace'&&!fi.value&&tags.length){tags=tags.slice(0,-1);onChange(tags);render();}
  });
  on(box,'click',()=>fi.focus());
  box.appendChild(fi);
  wrap.appendChild(box);
  return wrap;
}

// ── AVATAR UPLOAD + CROP ─────────────────────────────────────────────────────
function avatarSrc(av){return av&&typeof av==='object'?av.src:av;}
function avatarStyle(av,size){
  size=size||68;
  if(!av)return '';
  var ox=av&&typeof av==='object'?(av.offsetX||50):50;
  var oy=av&&typeof av==='object'?(av.offsetY||50):50;
  var zm=av&&typeof av==='object'?(av.zoom||1):1;
  var scaled=Math.round(size*zm);
  var offset=Math.round((scaled-size)/2);
  return 'width:'+scaled+'px;height:'+scaled+'px;object-fit:cover;object-position:'+ox+'% '+oy+'%;margin:'+(-offset)+'px 0 0 '+(-offset)+'px;display:block;';
}
function avatarWrapStyle(size,border,borderRadius){
  borderRadius=borderRadius||'50%';
  border=border||'2px solid var(--bdr)';
  return 'width:'+size+'px;height:'+size+'px;border-radius:'+borderRadius+';overflow:hidden;border:'+border+';flex-shrink:0;display:inline-block;vertical-align:middle;';
}
function mkAvatar(avatar,onChange){
  const wrap=h('div',{});
  const fi=h('input',{type:'file',accept:'image/jpeg,image/png,image/webp',style:{display:'none'}});
  const proc=f=>{
    if(!f)return;
    const type=(f.type||'').toLowerCase();
    const name=(f.name||'').toLowerCase();
    const isAllowed=type.startsWith('image/') && ['jpeg','png','webp'].includes(type.replace('image/','')) || /\.(jpe?g|png|webp)$/i.test(name);
    if(!isAllowed){alert('Please upload JPG, PNG, or WEBP.');fi.value='';return;}
    if(f.size>5*1024*1024){alert('Image must be under 5 MB.');fi.value='';return;}
    const r=new FileReader();
    r.onload=e=>{onChange({src:e.target.result,offsetX:50,offsetY:50,zoom:1},true); fi.value='';};

// ── DRAG & DROP LIST ──────────────────────────────────────────────────────────
function makeDraggable(container,getItems,setItems,renderItem){
  let dragging=null;
  const refresh=()=>{
    while(container.firstChild)container.removeChild(container.firstChild);
    getItems().forEach((item,i)=>{
      const el=renderItem(item,i);
      el.setAttribute('draggable','true');
      on(el,'dragstart',e=>{dragging=item.id;e.dataTransfer.effectAllowed='move';setTimeout(()=>el.classList.add('dragging'),0);});
      on(el,'dragend',()=>{dragging=null;el.classList.remove('dragging');refresh();});
      on(el,'dragover',e=>{e.preventDefault();el.classList.add('dragging-over');});
      on(el,'dragleave',()=>el.classList.remove('dragging-over'));
      on(el,'drop',e=>{
        e.preventDefault();el.classList.remove('dragging-over');
        if(!dragging||dragging===item.id)return;
        const arr=[...getItems()];const fi=arr.findIndex(x=>x.id===dragging);const ti=arr.findIndex(x=>x.id===item.id);
        if(fi<0||ti<0)return;const[r]=arr.splice(fi,1);arr.splice(ti,0,r);setItems(arr);refresh();
      });
      container.appendChild(el);
    });
  };
  refresh();
  return refresh;
}

function buildSkills(container){
  var desc=document.createElement('p');desc.className='sec-desc';
  desc.textContent='Add your own skill categories and tag skills within each one. Press Enter or comma to add a skill.';
  container.appendChild(desc);

  var catsWrap=document.createElement('div');catsWrap.id='skills-cats-wrap';
  container.appendChild(catsWrap);

  function ensureSkillCats(){
    if(!state.resume.skillCategories||!state.resume.skillCategories.length){
      state.resume=Object.assign({},state.resume,{skillCategories:[...DEFAULT_SKILL_CATS]});
    }
  }

  function renderAllCats(){
    ensureSkillCats();
    catsWrap.innerHTML='';
    state.resume.skillCategories.forEach(function(cat,idx){
      var block=document.createElement('div');
      block.style.cssText='background:var(--surf);border:1.5px solid var(--bdr);border-radius:10px;padding:12px 14px;margin-bottom:10px';

      // Header row: editable label + delete button
      var hdrRow=document.createElement('div');hdrRow.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:8px';
      var nameInput=document.createElement('input');nameInput.className='fi';
      nameInput.value=cat;nameInput.placeholder='Category name…';
      nameInput.style.cssText='flex:1;font-weight:600;font-size:13px';
      nameInput.onchange=function(){
        var oldCat=state.resume.skillCategories[idx];
        var newCat=nameInput.value.trim()||oldCat;
        if(newCat===oldCat)return;
        var cats=[...state.resume.skillCategories];cats[idx]=newCat;
        var sk=Object.assign({},state.resume.skills);
        if(sk[oldCat]!==undefined){sk[newCat]=sk[oldCat];delete sk[oldCat];}
        state.resume=Object.assign({},state.resume,{skillCategories:cats,skills:sk});
        scheduleSave();renderPreview();renderCompleteness();renderAllCats();
      };
      var delCatBtn=document.createElement('button');delCatBtn.className='btn-icon';delCatBtn.title='Remove category';delCatBtn.textContent='🗑️';
      delCatBtn.onclick=function(){
        if(!confirm('Remove this category and all its skills?'))return;
        var cats=state.resume.skillCategories.filter(function(_,i){return i!==idx;});
        var sk=Object.assign({},state.resume.skills);delete sk[cat];
        state.resume=Object.assign({},state.resume,{skillCategories:cats,skills:sk});
        scheduleSave();renderPreview();renderCompleteness();renderAllCats();
      };
      hdrRow.appendChild(nameInput);hdrRow.appendChild(delCatBtn);
      block.appendChild(hdrRow);

      // Tag area
      var tagArea=document.createElement('div');tagArea.style.cssText='display:flex;flex-wrap:wrap;gap:5px;min-height:10px;margin-bottom:8px';
      block.appendChild(tagArea);

      const SKILL_LEVELS=['','Beginner','Intermediate','Advanced','Expert'];
      const LEVEL_COLORS={'Beginner':'#a3e635','Intermediate':'#38bdf8','Advanced':'#818cf8','Expert':'#f472b6'};

      function skillName(t){return typeof t==='string'?t:t.name;}
      function skillLevel(t){return typeof t==='string'?'':t.level||'';}

      function refreshTags(currentCat){
        tagArea.innerHTML='';
        (state.resume.skills[currentCat]||[]).forEach(function(t){
          var name=skillName(t);var level=skillLevel(t);
          var span=document.createElement('span');span.className='tag';span.style.cssText='display:inline-flex;align-items:center;gap:4px;padding-right:4px';

          // Level dot
          var dot=document.createElement('span');
          dot.style.cssText='width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block';
          dot.style.background=level&&LEVEL_COLORS[level]?LEVEL_COLORS[level]:'#cbd5e1';
          dot.title=level||'No level set';
          span.appendChild(dot);

          var nameSpan=document.createElement('span');nameSpan.textContent=name;span.appendChild(nameSpan);

          // Level selector (click dot to cycle)
          dot.style.cursor='pointer';
          dot.onclick=function(e){
            e.stopPropagation();
            var cur=SKILL_LEVELS.indexOf(level);
            var next=SKILL_LEVELS[(cur+1)%SKILL_LEVELS.length];
            var sk=Object.assign({},state.resume.skills);
            sk[currentCat]=(sk[currentCat]||[]).map(function(x){return skillName(x)===name?{name:name,level:next}:x;});
            state.resume=Object.assign({},state.resume,{skills:sk});
            scheduleSave();renderPreview();refreshTags(currentCat);
          };

          var btn=document.createElement('button');btn.className='tag-x';btn.type='button';btn.textContent='×';
          btn.onclick=function(){
            var sk=Object.assign({},state.resume.skills);
            sk[currentCat]=(sk[currentCat]||[]).filter(function(x){return skillName(x)!==name;});
            state.resume=Object.assign({},state.resume,{skills:sk});
            scheduleSave();renderPreview();renderCompleteness();refreshTags(currentCat);
          };
          span.appendChild(btn);tagArea.appendChild(span);
        });
        // Level legend hint
        if((state.resume.skills[currentCat]||[]).length===0){
          var hint=document.createElement('span');hint.style.cssText='font-size:11px;color:var(--faint)';hint.textContent='Add skills below';
          tagArea.appendChild(hint);
        } else {
          var legend=document.createElement('div');legend.style.cssText='width:100%;margin-top:5px;font-size:10.5px;color:var(--faint)';
          legend.textContent='Click the dot on a skill to set proficiency: Beginner → Intermediate → Advanced → Expert';
          tagArea.appendChild(legend);
        }
      }
      refreshTags(cat);

      // Input row
      var inputRow=document.createElement('div');inputRow.style.cssText='display:flex;gap:6px';
      var fi=document.createElement('input');fi.className='fi';fi.type='text';
      fi.placeholder='Add a skill…';fi.style.cssText='flex:1';
      var addBtn=document.createElement('button');addBtn.className='btn-p';addBtn.type='button';
      addBtn.textContent='Add';addBtn.style.cssText='padding:8px 14px;font-size:13px;flex-shrink:0';
      inputRow.appendChild(fi);inputRow.appendChild(addBtn);
      block.appendChild(inputRow);

      function doAdd(currentCat){
        var v=fi.value.trim().replace(/,+$/,'').trim();if(!v)return;
        var cur=state.resume.skills[currentCat]||[];
        if(cur.find(function(x){return skillName(x)===v;})){fi.value='';return;}
        var sk=Object.assign({},state.resume.skills);sk[currentCat]=cur.concat([{name:v,level:''}]);
        state.resume=Object.assign({},state.resume,{skills:sk});
        scheduleSave();renderPreview();renderCompleteness();
        fi.value='';refreshTags(currentCat);fi.focus();
      }
      (function(currentCat){
        addBtn.onclick=function(){doAdd(currentCat);};
        fi.onkeydown=function(e){
          if(e.key==='Enter'||e.key===','){e.preventDefault();doAdd(currentCat);}
          if(e.key==='Backspace'&&!fi.value){
            var cur=state.resume.skills[currentCat]||[];if(!cur.length)return;
            var sk=Object.assign({},state.resume.skills);sk[currentCat]=cur.slice(0,-1);
            state.resume=Object.assign({},state.resume,{skills:sk});
            scheduleSave();renderPreview();renderCompleteness();refreshTags(currentCat);
          }
        };
      })(cat);

      catsWrap.appendChild(block);
    });

    // Add category button
    var addCatBtn=document.createElement('button');addCatBtn.className='btn-add';
    addCatBtn.textContent='+ Add Skill Category';
    addCatBtn.onclick=function(){
      ensureSkillCats();
      var newName='New Category';
      var cats=[...state.resume.skillCategories,newName];
      state.resume=Object.assign({},state.resume,{skillCategories:cats});
      scheduleSave();renderAllCats();
      // Focus the new category name input
      setTimeout(function(){
        var inputs=catsWrap.querySelectorAll('input.fi');
        if(inputs.length)inputs[inputs.length-1].focus();
      },50);
    };
    catsWrap.appendChild(addCatBtn);
  }

  renderAllCats();
}

function buildOrder(container){
  container.appendChild(h('p',{class:'sec-desc'},'Use arrows to reorder. Toggle the switch to show or hide a section in the resume.'));
  const listEl=h('div',{id:'order-list'});

  function renderOrderList(){
    while(listEl.firstChild)listEl.removeChild(listEl.firstChild);
    const order=state.resume.sectionOrder;
    let dragSrc=null;

    order.forEach(function(secId,i){
      const row=h('div',{class:'so-row'});
      row.setAttribute('draggable','true');
      row.dataset.secid=secId;

      // Drag handle
      const dh=h('span',{class:'dh',style:'font-size:16px;'},'⠿');
      row.appendChild(dh);

      // Label
      row.appendChild(h('span',{style:'flex:1;font-size:13.5px;'},SEC_LABELS[secId]||secId));

      // Up/Down buttons
      const upBtn=h('button',{class:'btn-ism',style:'padding:2px 8px;font-size:12px;'},'▲');
      const dnBtn=h('button',{class:'btn-ism',style:'padding:2px 8px;font-size:12px;'},'▼');
      upBtn.disabled=(i===0);
      dnBtn.disabled=(i===order.length-1);
      if(i===0)upBtn.style.opacity='0.3';
      if(i===order.length-1)dnBtn.style.opacity='0.3';

      on(upBtn,'click',function(){
        if(i===0)return;
        const o=[...state.resume.sectionOrder];
        var tmp=o[i-1];o[i-1]=o[i];o[i]=tmp;
        state.resume=Object.assign({},state.resume,{sectionOrder:o});
        scheduleSave();renderPreview();renderCompleteness();renderOrderList();
      });
      on(dnBtn,'click',function(){
        if(i>=order.length-1)return;
        const o=[...state.resume.sectionOrder];
        var tmp=o[i];o[i]=o[i+1];o[i+1]=tmp;
        state.resume=Object.assign({},state.resume,{sectionOrder:o});
        scheduleSave();renderPreview();renderCompleteness();renderOrderList();
      });
      row.appendChild(h('div',{style:'display:flex;gap:4px;'},upBtn,dnBtn));

      // Visibility toggle
      const tog=h('label',{class:'tog'});
      const cb=h('input',{type:'checkbox'});
      cb.checked=!!state.resume.sectionVisibility[secId];
      on(cb,'change',function(e){
        const sv=Object.assign({},state.resume.sectionVisibility);
        sv[secId]=e.target.checked?1:0;
        state.resume=Object.assign({},state.resume,{sectionVisibility:sv});
        scheduleSave();renderPreview();renderCompleteness();
      });
      tog.appendChild(cb);
      tog.appendChild(h('span',{class:'tsl'}));
      row.appendChild(tog);

      // Drag events
      on(row,'dragstart',function(e){
        dragSrc=secId;
        e.dataTransfer.effectAllowed='move';
        e.dataTransfer.setData('text/plain',secId);
        setTimeout(function(){row.style.opacity='0.4';},0);
      });
      on(row,'dragend',function(){
        row.style.opacity='1';
        dragSrc=null;
        Array.from(listEl.children).forEach(function(r){r.style.outline='';});
      });
      on(row,'dragover',function(e){
        e.preventDefault();
        e.dataTransfer.dropEffect='move';
        if(row.dataset.secid!==dragSrc)row.style.outline='2px dashed var(--acc)';
      });
      on(row,'dragleave',function(){row.style.outline='';});
      on(row,'drop',function(e){
        e.preventDefault();
        row.style.outline='';
        var src=dragSrc||e.dataTransfer.getData('text/plain');
        if(!src||src===secId)return;
        const o=[...state.resume.sectionOrder];
        var fi=o.indexOf(src);
        var ti=o.indexOf(secId);
        if(fi<0||ti<0)return;
        var removed=o.splice(fi,1)[0];
        o.splice(ti,0,removed);
        state.resume=Object.assign({},state.resume,{sectionOrder:o});
        scheduleSave();renderPreview();renderCompleteness();renderOrderList();
      });

      listEl.appendChild(row);
    });
  }

  renderOrderList();
  container.appendChild(listEl);

  // Page break inserter
  container.appendChild(h('hr',{class:'divider'}));
  container.appendChild(h('div',{class:'cust-title'},'Page Breaks'));
  container.appendChild(h('p',{class:'sec-desc',style:'margin-top:-6px'},'Force a page break before any section when printing or exporting to PDF.'));
  const pbWrap=h('div',{});
  function renderPBList(){
    while(pbWrap.firstChild)pbWrap.removeChild(pbWrap.firstChild);
    const breaks=state.resume.pageBreaks||[];
    state.resume.sectionOrder.forEach(function(secId){
      const row=h('div',{style:'display:flex;align-items:center;justify-content:space-between;padding:7px 10px;background:var(--surf);border:1.5px solid var(--bdr);border-radius:8px;margin-bottom:6px'});
      row.appendChild(h('span',{style:'font-size:13px'},SEC_LABELS[secId]||secId));
      const tog=h('label',{class:'tog'});
      const cb=h('input',{type:'checkbox'});
      cb.checked=breaks.includes(secId);
      on(cb,'change',function(e){
        var pb=[...(state.resume.pageBreaks||[])];
        if(e.target.checked){if(!pb.includes(secId))pb.push(secId);}
        else{pb=pb.filter(function(x){return x!==secId;});}
        state.resume=Object.assign({},state.resume,{pageBreaks:pb});
        scheduleSave();renderPreview();
      });
      tog.appendChild(cb);tog.appendChild(h('span',{class:'tsl'}));
      row.appendChild(tog);
      pbWrap.appendChild(row);
    });
  }
  renderPBList();
  container.appendChild(pbWrap);
}

// ── RESUME PREVIEW RENDERER ───────────────────────────────────────────────────
function css(obj){return Object.entries(obj).map(([k,v])=>`${k.replace(/([A-Z])/g,'-$1').toLowerCase()}:${v}`).join(';');}

function renderResume(){
  const r=state.resume;const acc=state.accent;const font=state.font;
  const tpl=state.template;
  const page=h('div',{class:'rpage'});

  if(tpl==='minimal') renderMinimal(page,r,acc);
  else if(tpl==='modern') renderModern(page,r,acc);
  else if(tpl==='two-column') renderTwoCol(page,r,acc);
  else if(tpl==='creative') renderCreative(page,r,acc);
  else if(tpl==='executive') renderExecutive(page,r,acc);
  else if(tpl==='compact') renderCompact(page,r,acc);
  else if(tpl==='sidebar-light') renderSidebarLight(page,r,acc);
  else if(tpl==='dark') renderDark(page,r,acc);
  else if(tpl==='timeline') renderTimeline(page,r,acc);
  else renderATS(page,r);

  // Apply font AFTER template renders so cssText overwrites don't kill it
  page.style.fontFamily=font;
  return page;
}

const pStyle='margin:0;color:#374151;font-size:8.5pt;line-height:1.6';
const baseStyle='padding:46px 42px;font-size:9pt;line-height:1.55;color:#111';

function secHead(label,acc,ats,mt,secId){
  const breaks=state.resume.pageBreaks||[];
  const pbClass=secId&&breaks.includes(secId)?'pb-before':'';
  if(ats)return h('div',{class:pbClass,style:`font-size:10pt;font-weight:700;text-transform:uppercase;border-bottom:1px solid #000;margin-bottom:6px;padding-bottom:2px;letter-spacing:.5px;margin-top:${mt||14}px`},label);
  return h('div',{class:pbClass,style:`font-size:7.5pt;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:${acc};border-bottom:1.5px solid ${acc}22;padding-bottom:4px;margin-bottom:9px;margin-top:${mt||14}px`},label);
}
function expEntry(e,acc,ats){
  const wrap=h('div',{class:'pb-avoid',style:'margin-bottom:11px'});
  const top=h('div',{style:'display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:4px'});
  const left=h('div',{});
  const title=h('span',{style:'font-weight:700;font-size:9.5pt'},e.title||'');
  left.appendChild(title);
  if(e.company){const co=h('span',{style:`color:${ats?'#000':acc};font-weight:500`},` @ ${e.company}`);left.appendChild(co);}
  const dates=h('span',{style:'color:#6b7280;font-size:8pt;white-space:nowrap'},`${fmt(e.start)}${(e.start||e.end||e.current)?' – ':''}${e.current?'Present':fmt(e.end)}`);
  top.appendChild(left);top.appendChild(dates);wrap.appendChild(top);
  if(e.location)wrap.appendChild(h('div',{style:'color:#9ca3af;font-size:8pt;margin-top:1px'},e.location));
  if(e.description)wrap.appendChild(h('p',{style:pStyle},e.description));
  if(e.bullets&&e.bullets.filter(Boolean).length){
    const ul=h('ul',{style:'margin:4px 0 0 16px;padding:0'});
    e.bullets.filter(Boolean).forEach(b=>ul.appendChild(h('li',{style:'color:#374151;margin-bottom:2px;font-size:8.5pt'},b)));
    wrap.appendChild(ul);
  }
  return wrap;
}
function projEntry(p,acc,ats){
  const wrap=h('div',{class:'pb-avoid',style:'margin-bottom:10px'});
  const top=h('div',{style:'display:flex;align-items:baseline;gap:8px;flex-wrap:wrap'});
  top.appendChild(h('span',{style:'font-weight:700;font-size:9.5pt'},p.name||''));
  const link=p.link||p.github||p.demo;
  if(link)top.appendChild(h('span',{style:`font-size:7.5pt;color:${ats?'#555':acc}`},`↗ ${link}`));
  wrap.appendChild(top);
  if(p.description)wrap.appendChild(h('p',{style:pStyle},p.description));
  const tagList=(p.tags||p.technologies||[]);
  if(tagList.length)wrap.appendChild(h('div',{style:'color:#9ca3af;font-size:7.5pt;margin-top:2px'},tagList.join(' · ')));
  if(p.results&&p.results.filter(Boolean).length){
    const ul=h('ul',{style:'margin:3px 0 0 16px;padding:0'});
    p.results.filter(Boolean).forEach(res=>ul.appendChild(h('li',{style:'color:#374151;font-size:8.5pt'},res)));
    wrap.appendChild(ul);
  }
  return wrap;
}
const LEVEL_DOT_COLORS={'Beginner':'#a3e635','Intermediate':'#38bdf8','Advanced':'#818cf8','Expert':'#f472b6'};
function skillNameOf(t){return typeof t==='string'?t:t.name;}
function skillLevelOf(t){return typeof t==='string'?'':t.level||'';}
function flatSkillCount(skills){return Object.values(skills).flat().length;}

function skillsGrid(skills,acc,ats){
  const wrap=h('div',{});
  const cats=Object.entries(skills).filter(([,v])=>v.length>0);
  cats.forEach(([cat,list])=>{
    if(ats){
      const row=h('div',{style:'margin-bottom:5px;font-size:8.5pt'});
      const lb=h('strong',{style:'text-transform:capitalize'},cat+': ');
      row.appendChild(lb);row.appendChild(document.createTextNode(list.map(skillNameOf).join(', ')));
      wrap.appendChild(row);
    }else{
      const row=h('div',{style:'display:flex;gap:8px;margin-bottom:5px;align-items:flex-start'});
      row.appendChild(h('span',{style:'color:#9ca3af;width:76px;flex-shrink:0;font-size:7.5pt;padding-top:3px;text-transform:capitalize'},cat));
      const tags=h('div',{style:'display:flex;flex-wrap:wrap;gap:3px'});
      list.forEach(function(s){
        var name=skillNameOf(s);var level=skillLevelOf(s);
        var tag=h('span',{style:`background:${acc}14;color:${acc};padding:2px 8px;border-radius:12px;font-size:7.5pt;font-weight:500;display:inline-flex;align-items:center;gap:3px`});
        if(level&&LEVEL_DOT_COLORS[level]){
          var dot=h('span',{style:`width:5px;height:5px;border-radius:50%;background:${LEVEL_DOT_COLORS[level]};flex-shrink:0;display:inline-block`});
          dot.title=level;tag.appendChild(dot);
        }
        tag.appendChild(document.createTextNode(name));
        tags.appendChild(tag);
      });
      row.appendChild(tags);wrap.appendChild(row);
    }
  });
  return wrap;
}
function contactLine(icon,text){
  if(!text)return null;
  return h('span',{style:'display:inline-flex;align-items:center;gap:4px'},icon+' '+text);
}
function contactBar(p,style=''){
  const bar=h('div',{style:`display:flex;flex-wrap:wrap;gap:4px 18px;font-size:8pt;${style}`});
  const extraLink=(p.extraLinks&&p.extraLinks[0])?p.extraLinks[0].url||p.extraLinks[0].label:'';
  [['✉',p.email],['☏',p.phone],['⌖',p.location],['in',p.linkedin],['🔗',p.website||extraLink]].forEach(([ic,tx])=>{const cl=contactLine(ic,tx);if(cl)bar.appendChild(cl);});
  return bar;
}
function allSections(r,acc,ats){
  const frag=document.createDocumentFragment();
  r.sectionOrder.forEach(sec=>{
    if(!r.sectionVisibility[sec])return;
    if(sec==='summary'&&r.summary){frag.appendChild(secHead('Summary',acc,ats));frag.appendChild(h('p',{style:pStyle},r.summary));return;}
    if(sec==='experience'&&r.experience.length){frag.appendChild(secHead('Experience',acc,ats));r.experience.forEach(e=>frag.appendChild(expEntry(e,acc,ats)));return;}
    if(sec==='skills'&&flatSkillCount(r.skills)){frag.appendChild(secHead('Skills',acc,ats));frag.appendChild(skillsGrid(r.skills,acc,ats));return;}
    if(sec==='projects'&&r.projects.length){frag.appendChild(secHead('Projects',acc,ats));r.projects.forEach(p=>frag.appendChild(projEntry(p,acc,ats)));return;}
    if(sec==='education'&&r.education.length){
      frag.appendChild(secHead('Education',acc,ats));
      r.education.forEach(e=>{
        const wrap=h('div',{style:'margin-bottom:9px'});
        const top=h('div',{style:'display:flex;justify-content:space-between;flex-wrap:wrap'});
        top.appendChild(h('span',{style:'font-weight:700;font-size:9.5pt'},e.degree||''));
        top.appendChild(h('span',{style:'color:#6b7280;font-size:8pt'},`${fmt(e.start)}${e.start&&e.end?' – ':''}${fmt(e.end)}`));
        wrap.appendChild(top);
        wrap.appendChild(h('div',{style:'color:#6b7280;font-size:8.5pt'},e.institution+(e.location?`, ${e.location}`:'')));
        if(e.description)wrap.appendChild(h('p',{style:pStyle},e.description));
        frag.appendChild(wrap);
      });return;
    }
    if(sec==='certifications'&&r.certifications.length){
      frag.appendChild(secHead('Certifications',acc,ats));
      r.certifications.forEach(c=>{
        const wrap=h('div',{style:'margin-bottom:7px'});
        wrap.appendChild(h('div',{style:'font-weight:700;font-size:9pt'},c.name||''));
        wrap.appendChild(h('div',{style:'color:#6b7280;font-size:8pt'},[c.org,fmt(c.date)].filter(Boolean).join(' · ')+(c.url?` · ${c.url}`:'')));
        frag.appendChild(wrap);
      });return;
    }
    if(sec==='languages'&&r.languages.length){
      frag.appendChild(secHead('Languages',acc,ats));
      const bar=h('div',{style:'display:flex;flex-wrap:wrap;gap:4px 20px;font-size:8.5pt'});
      r.languages.forEach(l=>{const s=h('span',{});s.innerHTML=`<strong>${l.language}</strong> <span style="color:#6b7280">– ${l.level}</span>`;bar.appendChild(s);});
      frag.appendChild(bar);return;
    }
    if(sec==='achievements'&&r.achievements.length){
      frag.appendChild(secHead('Achievements',acc,ats));
      r.achievements.forEach(a=>{
        const wrap=h('div',{style:'margin-bottom:7px'});
        const title=h('div',{style:'font-weight:700;font-size:9pt'},a.title||'');
        if(a.date)title.appendChild(h('span',{style:'font-weight:400;color:#9ca3af;font-size:8pt'},` · ${fmt(a.date)}`));
        wrap.appendChild(title);
        if(a.description)wrap.appendChild(h('p',{style:pStyle},a.description));
        frag.appendChild(wrap);
      });
    }
  });
  return frag;
}

  summary:{title:'Writing a strong summary',items:['Keep it to 2–4 sentences. Recruiters spend ~7 seconds on a first scan.','Lead with your years of experience and area of expertise.','Mention 1–2 concrete achievements or differentiators.','Avoid vague phrases like "passionate team player" — be specific.','Tailor this section for each role you apply to.']},
  experience:{title:'Work experience tips',items:['Use bullet points starting with strong action verbs (Led, Built, Grew, Reduced…).','Quantify results wherever possible — numbers stand out instantly.','List jobs in reverse chronological order (most recent first).','For older roles (5+ years ago), 2–3 bullets is enough.','Include location or "Remote" for each role.']},
  skills:{title:'Skills section tips',items:['Group skills into logical categories — it\'s much easier to scan.','Prioritize skills relevant to the role you\'re targeting.','Avoid listing very basic skills (e.g. "Microsoft Word" unless the role requires it).','Use the proficiency level to give context — don\'t list everything as Expert.','Soft skills are better shown through experience bullets than listed here.']},
  projects:{title:'Portfolio & projects tips',items:['Include real outcomes — metrics, audience size, revenue impact, or engagement.','For creative work, always link to the actual piece or a case study.','Keep descriptions concise — one sentence is enough, bullets do the rest.','Tailor which projects you show to the role you\'re applying for.']},

// Update only the live preview panel (no editor rebuild = no focus loss)
function renderPreview(){
  const wrap=$('prev-wrap');
  if(!wrap)return;
  while(wrap.firstChild)wrap.removeChild(wrap.firstChild);
  const page=renderResume();
  wrap.appendChild(page);
  wrap.style.transform=`scale(${state.zoom})`;
  const zl=$('zoom-lbl');if(zl)zl.textContent=`${Math.round(state.zoom*100)}%`;
  const tl=$('prev-tpl-lbl');if(tl)tl.textContent=TPL_NAMES[state.template]||state.template;
  // Estimate page count and show page break lines
  requestAnimationFrame(()=>{
    const pageH=1122; // A4 height in px at 96dpi
    const actualH=page.scrollHeight;
    const pages=Math.max(1,Math.ceil(actualH/pageH));
    const pc=$('page-count');
    if(pc)pc.textContent=pages===1?'1 page':pages+' pages';
    // Draw page break markers
    wrap.querySelectorAll('.page-break-line').forEach(el=>el.remove());
    for(let i=1;i<pages;i++){
      const line=h('div',{class:'page-break-line',style:`position:absolute;left:0;right:0;top:${i*pageH}px;height:2px;background:rgba(239,68,68,0.5);z-index:10;pointer-events:none`});
      const label=h('span',{style:'position:absolute;right:4px;top:-14px;font-size:9px;color:#ef4444;background:#fff;padding:1px 4px;border-radius:3px;font-family:sans-serif'},'Page '+i+' ends');
      line.appendChild(label);
      wrap.style.position='relative';
      wrap.appendChild(line);
    }
  });
}

// Update only the completeness bar (no editor rebuild = no focus loss)
function renderCompleteness(){
  const {score,hints}=completeness(state.resume);
  const cf=$('comp-fill');const cs=$('comp-score');const ch=$('comp-hints');
  if(!cf)return;
  cf.style.width=`${score}%`;
  const col=score>=80?'#22c55e':score>=50?'#f59e0b':'#ef4444';
  cf.style.background=col;cs.textContent=`${score}%`;cs.style.color=col;
  ch.innerHTML=hints.map(hint=>`<span>💡 ${hint}</span>`).join('');
}

// Full render: used when switching sections, templates, zoom, mobile tab, accent, font
function render(){
  const app=$('app');if(!app)return;

  // Update CSS accent variable
  document.documentElement.style.setProperty('--acc',state.accent);
  document.documentElement.style.setProperty('--acc-l',state.accent+'14');

  renderCompleteness();

  // Update nav active state
  document.querySelectorAll('.nav-btn').forEach(b=>{b.classList.toggle('on',b.dataset.id===state.activeSection);});
  // Update mobile section bar
  document.querySelectorAll('.mob-section-btn').forEach(function(b){
    const isOn=b.dataset.sid===state.activeSection;
    b.classList.toggle('on',isOn);
    if(isOn)b.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  });

  // Update saved indicator
  const si=$('saved-ind');
  if(si&&state.lastSaved)si.innerHTML=`<span class="saved-dot"></span>${state.lastSaved.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} saved`;

  // Rebuild editor content (only called on section switch / template change etc)
  rebuildEditorHeader();

  renderPreview();

  // Mobile tab visibility
  const mob=state.mobileTab==='preview';
  const sidebar=qs('.sidebar');const editor=qs('.editor');const preview=qs('.preview-panel');
  if(sidebar&&editor&&preview){
    sidebar.classList.toggle('hide-mob',mob);
    editor.classList.toggle('hide-mob',mob);
    preview.classList.toggle('mob-show',mob);
  }
  // Update bottom nav active state
  const bnBtns=document.querySelectorAll('.mob-bn-btn');
  bnBtns.forEach(function(b){
    const isEdit=b.textContent.includes('Edit');
    const isPrev=b.textContent.includes('Preview');
    const isTpl=b.textContent.includes('Templates');
    const isStyle=b.textContent.includes('Style');
    if(isPrev)b.classList.toggle('on',state.mobileTab==='preview');
    else if(isEdit)b.classList.toggle('on',state.mobileTab==='editor'&&state.activeSection!=='templates'&&state.activeSection!=='customize');
    else if(isTpl)b.classList.toggle('on',state.activeSection==='templates');
    else if(isStyle)b.classList.toggle('on',state.activeSection==='customize');
  });

function openResumeManager(){
  let ov=$('rm-ov');
  if(ov){ov.classList.remove('hide');renderRMSlots();return;}
  ov=h('div',{class:'rm-ov',id:'rm-ov'});
  const panel=h('div',{class:'rm-panel'});
  const head=h('div',{class:'rm-head'});
  head.appendChild(h('div',{class:'rm-title'},'📄 My Resumes'));
  const closeBtn=h('button',{class:'btn-icon',style:'font-size:20px'},'×');
  on(closeBtn,'click',()=>ov.classList.add('hide'));
  on(ov,'click',e=>{if(e.target===ov)ov.classList.add('hide');});
  head.appendChild(closeBtn);
  panel.appendChild(head);
  const body=h('div',{class:'rm-body',id:'rm-body'});
  panel.appendChild(body);
  const foot=h('div',{class:'rm-foot'});
  const newBtn=h('button',{class:'btn-p'},'+ New Resume');
  on(newBtn,'click',()=>{
    newResume();
    ov.classList.add('hide');
  });
  const sampleBtn=h('button',{class:'btn-sm'},'📋 Load Sample');
  on(sampleBtn,'click',()=>{
    if(confirm('Load sample into current resume? This replaces current data.'))
      setState({resume:JSON.parse(JSON.stringify(SAMPLE))});

  foot.appendChild(newBtn);foot.appendChild(sampleBtn);

}

function renderRMSlots(){
  const body=$('rm-body');if(!body)return;
  while(body.firstChild)body.removeChild(body.firstChild);
  // Save current state into slots before rendering
  const liveSlots=state.slots.map(s=>
    s.id===state.activeId
      ?{...s,data:state.resume,template:state.template,accent:state.accent,font:state.font,updatedAt:new Date().toISOString()}
      :s
  );
  liveSlots.forEach(slot=>{
    const row=h('div',{class:'rm-slot'+(slot.id===state.activeId?' on':'')});

    // Active indicator
    const dot=h('span',{style:`width:8px;height:8px;border-radius:50%;flex-shrink:0;background:${slot.id===state.activeId?'var(--acc)':'var(--bdr)'}`});
    row.appendChild(dot);

    // Editable name
    const nameWrap=h('div',{class:'rm-slot-name'});
    const nameInput=h('input',{type:'text',value:slot.name||'Resume'});
    on(nameInput,'change',e=>{renameResume(slot.id,e.target.value.trim()||'Resume');renderRMSlots();});
    on(nameInput,'click',e=>e.stopPropagation());
    nameWrap.appendChild(nameInput);
    // Meta: person name + updated
    const personName=slot.data&&slot.data.personal&&slot.data.personal.name?slot.data.personal.name:'Untitled';
    const updated=slot.updatedAt?new Date(slot.updatedAt).toLocaleDateString(undefined,{month:'short',day:'numeric'}):'';
    nameWrap.appendChild(h('div',{class:'rm-slot-meta'},personName+(updated?' · '+updated:'')));
    row.appendChild(nameWrap);

    // Actions
    const acts=h('div',{style:'display:flex;gap:4px;flex-shrink:0'});
    if(slot.id!==state.activeId){
      const openBtn=h('button',{class:'btn-p',style:'padding:5px 12px;font-size:12px'},'Open');
      on(openBtn,'click',()=>{switchResume(slot.id);$('rm-ov').classList.add('hide');});
      acts.appendChild(openBtn);
    } else {
      acts.appendChild(h('span',{style:'font-size:11px;color:var(--acc);font-weight:700;padding:5px 8px'},'Active'));
    }
    const dupBtn=h('button',{class:'btn-sm',style:'padding:5px 9px;font-size:13px',title:'Duplicate'},'📋');
    on(dupBtn,'click',()=>{duplicateResume(slot.id);renderRMSlots();});
    acts.appendChild(dupBtn);
    if(state.slots.length>1){
      const delBtn=h('button',{class:'btn-sm dng',style:'padding:5px 9px;font-size:13px',title:'Delete'},'🗑️');
      on(delBtn,'click',()=>{
        if(confirm(`Delete "${slot.name||'Resume'}"? This cannot be undone.`)){
          deleteResume(slot.id);renderRMSlots();
        }
      });
      acts.appendChild(delBtn);
    }
    row.appendChild(acts);
    body.appendChild(row);
  });
  if(liveSlots.length===0){
    body.appendChild(h('p',{style:'color:var(--muted);text-align:center;padding:24px'},'No resumes yet. Create one below.'));
  }
}

const OB_STEPS=[
  {icon:'👋',title:'Welcome to ResumeBuilder',desc:'Build a professional resume in minutes — for any career. Your data is saved automatically in your browser and never leaves your device.'},
  {icon:'✏️',title:'Edit on the left',desc:'Use the sidebar to jump between sections. Fill in your details, experience, skills, and more. Each section has a 💡 tip button with expert advice.'},
  {icon:'👁️',title:'Preview on the right',desc:'See your resume update live as you type. Switch templates, change colors, adjust fonts, and control page breaks — all in real time.'},
  {icon:'🚀',title:"You're ready!",desc:'When you\'re done, export to PDF or Word (.docx). You can also share a link or save your data as JSON to come back later.'},
];
function showOnboarding(){
  if(localStorage.getItem('rb1_onboarded')){return;}
  let step=0;
  const ov=h('div',{class:'ob-ov',id:'ob-ov'});
  const modal=h('div',{class:'ob-modal'});
  // Step bar
  const stepBar=h('div',{class:'ob-steps'});
  OB_STEPS.forEach(function(_,i){stepBar.appendChild(h('div',{class:'ob-step',id:'ob-s'+i}));});
  modal.appendChild(stepBar);
  // Body
  const body=h('div',{class:'ob-body'});
  const icon=h('div',{class:'ob-icon'});
  const title=h('div',{class:'ob-title'});
  const desc=h('div',{class:'ob-desc'});
  body.appendChild(icon);body.appendChild(title);body.appendChild(desc);
  modal.appendChild(body);
  // Footer
  const foot=h('div',{class:'ob-foot'});
  const skipBtn=h('button',{class:'btn-g',style:'font-size:13px'},'Skip');
  const dots=h('div',{class:'ob-dots'});
  OB_STEPS.forEach(function(_,i){dots.appendChild(h('div',{class:'ob-dot',id:'ob-d'+i}));});
  const nextBtn=h('button',{class:'btn-p'},'Next →');
  foot.appendChild(skipBtn);foot.appendChild(dots);foot.appendChild(nextBtn);
  modal.appendChild(foot);
  ov.appendChild(modal);
  document.body.appendChild(ov);

  function update(){
    const s=OB_STEPS[step];
    icon.textContent=s.icon;title.textContent=s.title;desc.textContent=s.desc;
    OB_STEPS.forEach(function(_,i){
      document.getElementById('ob-s'+i).classList.toggle('done',i<=step);
      document.getElementById('ob-d'+i).classList.toggle('on',i===step);
    });
    nextBtn.textContent=step===OB_STEPS.length-1?"Let's go! 🎉":'Next →';
  }
  function finish(){
    localStorage.setItem('rb1_onboarded','1');
    ov.classList.add('hide');
    setTimeout(function(){if(ov.parentNode)ov.parentNode.removeChild(ov);},300);
  }
  on(nextBtn,'click',function(){if(step<OB_STEPS.length-1){step++;update();}else{finish();}});
  on(skipBtn,'click',finish);
  update();
}
function exportDOCX(){
