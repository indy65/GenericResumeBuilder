  a.click();
  URL.revokeObjectURL(a.href);
}


function mount(){
  const {score,hints}=completeness(state.resume);
  const app=$('app');
  // Build sidebar
  const sidebar=h('nav',{class:'sidebar'});
  // Completeness
  const comp=h('div',{class:'comp'});
  const compHdr=h('div',{class:'comp-hdr'},h('span',{},'Resume completeness'),h('span',{id:'comp-score',style:`color:${score>=80?'#22c55e':score>=50?'#f59e0b':'#ef4444'};font-weight:700`},`${score}%`));
  const compBar=h('div',{class:'comp-bar'},h('div',{id:'comp-fill',class:'comp-fill',style:`width:${score}%;background:${score>=80?'#22c55e':score>=50?'#f59e0b':'#ef4444'}`}));
  const compHints=h('div',{id:'comp-hints',class:'comp-hints'});
  hints.forEach(hint=>compHints.appendChild(h('span',{},`💡 ${hint}`)));
  comp.appendChild(compHdr);comp.appendChild(compBar);comp.appendChild(compHints);
  sidebar.appendChild(comp);
  NAV.forEach(item=>{
    if(item.g){sidebar.appendChild(h('div',{class:'sg'},item.g));return;}
    const btn=h('button',{class:`nav-btn${state.activeSection===item.id?' on':''}`,['data-id']:item.id});
    btn.appendChild(h('span',{class:'nav-icon'},item.icon));
    btn.appendChild(h('span',{},item.label));
    on(btn,'click',()=>setState({activeSection:item.id}));
    sidebar.appendChild(btn);
  });
  // Mobile sample/clear at bottom
  const mobs=h('div',{style:'margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:6px'});
  const smpl2=h('button',{class:'btn-sm',style:'width:100%'},'📋 Sample');
  const clr2=h('button',{class:'btn-sm',style:'width:100%'},'🗑 Clear');
  on(smpl2,'click',()=>{if(confirm('Load sample resume?')){setState({resume:JSON.parse(JSON.stringify(SAMPLE))});}});
  on(clr2,'click',()=>{if(confirm('Clear all data?')){setState({resume:JSON.parse(JSON.stringify(EMPTY))});}});
  mobs.appendChild(smpl2);mobs.appendChild(clr2);sidebar.appendChild(mobs);

  // Editor
  const editor=h('div',{class:'editor'});
  const edInner=h('div',{class:'ed-inner',id:'ed-inner'});
  editor.appendChild(edInner);

  // Preview
  const preview=h('div',{class:'preview-panel'});
  const toolbar=h('div',{class:'prev-toolbar'});
  const tl=h('div',{class:'prev-tl'});
  const zOut=h('button',{class:'btn-ism'},'−');const zLbl=h('span',{id:'zoom-lbl',class:'zoom-lbl'},`${Math.round(state.zoom*100)}%`);const zIn=h('button',{class:'btn-ism'},'+');const zRst=h('button',{class:'btn-ism',style:'font-size:11px'},'Reset');
  on(zOut,'click',()=>setState({zoom:Math.max(0.4,parseFloat((state.zoom-.1).toFixed(2)))}));
  on(zIn,'click',()=>setState({zoom:Math.min(1.6,parseFloat((state.zoom+.1).toFixed(2)))}));
  on(zRst,'click',()=>setState({zoom:0.82}));
  tl.appendChild(zOut);tl.appendChild(zLbl);tl.appendChild(zIn);tl.appendChild(zRst);
  // Margin control
  const marginWrap=h('div',{class:'margin-ctrl',style:'display:flex;align-items:center;gap:5px;margin-left:8px;padding-left:8px;border-left:1px solid var(--bdr)'});
  marginWrap.appendChild(h('span',{style:'font-size:11px;color:var(--muted);white-space:nowrap'},'Margins:'));
  const marginSl=h('input',{type:'range',min:'16',max:'64',value:'44',step:'4',style:'width:70px;accent-color:var(--acc)',title:'Adjust resume page margins',id:'margin-slider'});
  const marginLbl=h('span',{style:'font-size:11px;color:var(--faint);min-width:24px'},marginSl.value+'px');
  on(marginSl,'input',function(e){
    marginLbl.textContent=e.target.value+'px';
    const pages=document.querySelectorAll('.rpage');
    pages.forEach(p=>{
      // Override padding on the resume page - handle both cssText and individual padding
      p.style.setProperty('padding',e.target.value+'px','important');
    });
  });
  marginWrap.appendChild(marginSl);marginWrap.appendChild(marginLbl);
  tl.appendChild(marginWrap);
  const tr=h('div',{class:'prev-tr'});
  const tplLbl=h('span',{id:'prev-tpl-lbl',class:'prev-tpl-lbl'},TPL_NAMES[state.template]||state.template);
  const pageCountLbl=h('span',{id:'page-count',style:'font-size:11px;color:var(--faint);background:var(--surf2);padding:3px 8px;border-radius:6px;border:1px solid var(--bdr)'},'1 page');
  const pdfBtn=h('button',{class:'btn-sm',style:'font-size:11px'},'⬇ PDF');on(pdfBtn,'click',()=>window.print());
  tr.appendChild(pageCountLbl);tr.appendChild(tplLbl);tr.appendChild(pdfBtn);
  toolbar.appendChild(tl);toolbar.appendChild(tr);

  // Mobile floating PDF/export button (shown in preview tab)
  const mobFab=h('div',{class:'mob-fab',id:'mob-fab'});
  const fabPdf=h('button',{style:'background:var(--acc);color:#fff;border:none;border-radius:24px;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:7px'},'⬇ PDF');
  const fabDocx=h('button',{style:'background:var(--surf);color:var(--txt);border:1.5px solid var(--bdr);border-radius:24px;padding:11px 16px;font-size:13px;font-weight:600;cursor:pointer;margin-left:8px'},'📝 DOCX');
  on(fabPdf,'click',()=>window.print());
  on(fabDocx,'click',exportDOCX);
  mobFab.appendChild(fabPdf);mobFab.appendChild(fabDocx);
  document.body.appendChild(mobFab);

  // Bottom nav (mobile only)
  const mobBottomNav=h('div',{class:'mob-bottom-nav',id:'mob-bottom-nav'});
  const mobNavInner=h('div',{class:'mob-bottom-nav-inner'});
  const MOB_NAV=[
    {id:'editor',icon:'✏️',label:'Edit'},
    {id:'preview',icon:'👁️',label:'Preview'},
    {id:'templates',icon:'📄',label:'Templates'},
    {id:'customize',icon:'🎨',label:'Style'},
  ];
  const mobNavBtns={};
  MOB_NAV.forEach(function(item){
    const btn=h('button',{class:'mob-bn-btn'+(state.mobileTab===item.id?' on':'')},
      h('span',{class:'bn-icon'},item.icon),
      h('span',{},item.label)
    );
    mobNavBtns[item.id]=btn;
    on(btn,'click',function(){
      if(item.id==='templates'){
        setState({activeSection:'templates',mobileTab:'editor'});
        updateMobNav('editor');
      } else if(item.id==='customize'){
        setState({activeSection:'customize',mobileTab:'editor'});
        updateMobNav('editor');
      } else {
        setState({mobileTab:item.id});
        updateMobNav(item.id);
      }
      updateMobFab();
    });
    mobNavInner.appendChild(btn);
  });
  mobBottomNav.appendChild(mobNavInner);
  document.body.appendChild(mobBottomNav);

  function updateMobNav(activeId){
    Object.keys(mobNavBtns).forEach(function(k){
      mobNavBtns[k].classList.toggle('on',k===activeId);
    });
  }
  function updateMobFab(){
    const isMobilePreview=window.innerWidth<=640&&state.mobileTab==='preview';
    mobFab.style.display=isMobilePreview?'flex':'none';
  }
  // Legacy floating PDF button (kept for >640px usage)
  const mobPdfBtn=h('button',{style:'display:none;position:fixed;bottom:20px;right:20px;z-index:100;background:var(--acc);color:#fff;border:none;border-radius:50px;padding:13px 20px;font-size:15px;font-weight:700;box-shadow:0 4px 20px rgba(0,0,0,.25);cursor:pointer'},'⬇ PDF');
  on(mobPdfBtn,'click',()=>window.print());
  document.body.appendChild(mobPdfBtn);
  function updateMobPdf(){
    const isMobilePreview=window.innerWidth<=640&&state.mobileTab==='preview';
    mobPdfBtn.style.display=isMobilePreview&&window.innerWidth>640?'block':'none';
    updateMobFab();
  }
  window.addEventListener('resize',function(){updateMobPdf();updateMobFab();});

  const prevScroll=h('div',{class:'prev-scroll',id:'prev-scroll'});
  const prevWrap=h('div',{id:'prev-wrap',class:'prev-wrap',style:`transform:scale(${state.zoom})`});
  prevWrap.appendChild(renderResume());
  prevScroll.appendChild(prevWrap);
  preview.appendChild(toolbar);preview.appendChild(prevScroll);

  // Header
  const header=h('div',{class:'header'});
  header.appendChild(h('div',{class:'hbrand'},h('span',{class:'hlogo'},'◈'),'Resume',h('span',{},'Builder')));
  const hctr=h('div',{class:'hctr',id:'saved-ind'},'');
  header.appendChild(hctr);
  const hacts=h('div',{class:'hacts'});
  // Undo/Redo buttons
  const undoBtn=h('button',{id:'btn-undo',class:'btn-sm',title:'Undo (Ctrl+Z)',style:'opacity:0.35;font-size:14px;padding:5px 10px'},'↩');
  const redoBtn=h('button',{id:'btn-redo',class:'btn-sm',title:'Redo (Ctrl+Y)',style:'opacity:0.35;font-size:14px;padding:5px 10px'},'↪');
  on(undoBtn,'click',undo);on(redoBtn,'click',redo);
  const resumesMgrBtn=h('button',{class:'btn-sm hide-sm',title:'Manage resumes',style:'font-weight:700'},'📄 My Resumes');
  on(resumesMgrBtn,'click',openResumeManager);
  hacts.appendChild(undoBtn);hacts.appendChild(redoBtn);hacts.appendChild(resumesMgrBtn);
  // Keyboard shortcuts
  document.addEventListener('keydown',function(e){
    const tag=document.activeElement&&document.activeElement.tagName;
    const inField=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT';
    if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!e.shiftKey){e.preventDefault();undo();}
    if((e.ctrlKey||e.metaKey)&&(e.key==='y'||(e.key==='z'&&e.shiftKey))){e.preventDefault();redo();}
    if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();scheduleSave();const si=$('saved-ind');if(si){si.innerHTML='<span class="saved-dot"></span>Saving…';setTimeout(()=>{if(state.lastSaved)si.innerHTML='<span class="saved-dot"></span>'+state.lastSaved.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+' saved';},900);}}
  });
  const smplBtn=h('button',{class:'btn-sm hide-sm'},h('span',{},'📋 Sample'));on(smplBtn,'click',()=>{if(confirm('Load sample resume? This replaces current data.'))setState({resume:JSON.parse(JSON.stringify(SAMPLE))});});
  const clrBtn=h('button',{class:'btn-sm hide-sm'},h('span',{},'🗑 Clear'));on(clrBtn,'click',()=>{if(confirm('Clear all resume data?'))setState({resume:JSON.parse(JSON.stringify(EMPTY))});});
  // Import
  const impFile=h('input',{type:'file',accept:'.json',style:'display:none'});
  on(impFile,'change',e=>{
    const f=e.target.files[0];if(!f)return;
    const reader=new FileReader();
    reader.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.resume){setState({resume:d.resume,template:d.template||state.template,accent:d.accent||state.accent,font:d.font||state.font});}else setState({resume:d});alert('Resume imported!');}catch{alert('Invalid file.');}};
    reader.readAsText(f);e.target.value='';
  });
  const impLbl=h('label',{class:'btn-sm hide-sm',style:'cursor:pointer'},'📂 Import');impLbl.appendChild(impFile);
  const expBtn=h('button',{class:'btn-sm hide-sm'},'💾 Export');
  on(expBtn,'click',()=>{const blob=new Blob([JSON.stringify({resume:state.resume,template:state.template,accent:state.accent,font:state.font,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${state.resume.personal.name||'resume'}-resume.json`;a.click();URL.revokeObjectURL(a.href);});
  // Share link button
  const shareBtn=h('button',{class:'btn-sm hide-sm',title:'Copy shareable link'},'🔗 Share');
  on(shareBtn,'click',()=>{
    try{
      const payload={resume:state.resume,template:state.template,accent:state.accent,font:state.font};
      const json=JSON.stringify(payload);
      const encoded=btoa(unescape(encodeURIComponent(json)));
      const url=window.location.href.split('#')[0]+'#resume='+encoded;
      if(url.length>2000000){alert('Resume data is too large to share via URL. Use Export JSON instead.');return;}
      navigator.clipboard.writeText(url).then(()=>{
        shareBtn.textContent='✅ Copied!';
        setTimeout(()=>{shareBtn.textContent='🔗 Share';},2500);
      }).catch(()=>{prompt('Copy this link to share your resume:',url);});
    }catch(e){alert('Could not generate share link. Use Export JSON instead.');}
  });
  const prtBtn=h('button',{class:'btn-sm hide-sm'},'🖨 Print');on(prtBtn,'click',()=>window.print());
  const pdfBtn2=h('button',{class:'btn-p',style:'padding:5px 14px;font-size:13px'},'⬇ PDF');on(pdfBtn2,'click',()=>window.print());
  const docxBtn=h('button',{class:'btn-sm hide-sm',title:'Export as Word (.docx)'},'📝 DOCX');
  on(docxBtn,'click',exportDOCX);
  hacts.appendChild(smplBtn);hacts.appendChild(clrBtn);hacts.appendChild(impLbl);hacts.appendChild(expBtn);hacts.appendChild(shareBtn);hacts.appendChild(docxBtn);hacts.appendChild(prtBtn);hacts.appendChild(pdfBtn2);
  header.appendChild(hacts);

  // Desktop mob-tabs (shown 640-900px)
  const mobTabs=h('div',{class:'mob-tabs'});
  const edTab=h('button',{class:`mob-tab${state.mobileTab==='editor'?' on':''}`},'✏️ Editor');
  const pvTab=h('button',{class:`mob-tab${state.mobileTab==='preview'?' on':''}`},'👁 Preview');
  on(edTab,'click',()=>{setState({mobileTab:'editor'});edTab.classList.add('on');pvTab.classList.remove('on');const sb=$('mob-sec-bar');if(sb)sb.style.display='';updateMobPdf();});
  on(pvTab,'click',()=>{setState({mobileTab:'preview'});pvTab.classList.add('on');edTab.classList.remove('on');const sb=$('mob-sec-bar');if(sb)sb.style.display='none';updateMobPdf();});
  mobTabs.appendChild(edTab);mobTabs.appendChild(pvTab);

  // Mobile action bar (Sample, Clear, Import, Export, Share)
  const mobActionBar=h('div',{class:'mob-action-bar',id:'mob-action-bar'});
  const mobActSample=h('button',{class:'btn-sm'},'📋 Sample');
  const mobActClear=h('button',{class:'btn-sm'},'🗑 Clear');
  const mobActImport=h('button',{class:'btn-sm'},'📂 Import');
  const mobActExport=h('button',{class:'btn-sm'},'💾 Export');
  const mobActShare=h('button',{class:'btn-sm'},'🔗 Share');
  // Wire up same actions as desktop header buttons
  on(mobActSample,'click',()=>{if(confirm('Load sample resume? This replaces current data.')){setState({resume:JSON.parse(JSON.stringify(SAMPLE))});}});
  on(mobActClear,'click',()=>{if(confirm('Clear all resume data?')){setState({resume:JSON.parse(JSON.stringify(EMPTY))});}});
  on(mobActImport,'click',()=>{const fi=document.createElement('input');fi.type='file';fi.accept='.json';fi.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.resume)setState({resume:d.resume,template:d.template||state.template,accent:d.accent||state.accent,font:d.font||state.font});else alert('Invalid file.');}catch{alert('Invalid file.');}};r.readAsText(f);};fi.click();});
  on(mobActExport,'click',()=>{const d={resume:state.resume,template:state.template,accent:state.accent,font:state.font};const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='resume.json';a.click();});
  on(mobActShare,'click',async()=>{try{const d={resume:state.resume,template:state.template,accent:state.accent,font:state.font};const json=JSON.stringify(d);const b64=btoa(unescape(encodeURIComponent(json)));const url=window.location.origin+window.location.pathname+'#resume='+b64;if(b64.length>30000){alert('Resume data is too large to share via URL. Use Export JSON instead.');return;}await navigator.clipboard.writeText(url);alert('✅ Copied! Share this link to let others view your resume.');}catch{alert('Could not copy link. Use Export JSON instead.');}});
  [mobActSample,mobActClear,mobActImport,mobActExport,mobActShare].forEach(b=>mobActionBar.appendChild(b));

  // Mobile section picker bar (horizontal scroll)
  const mobSecBar=h('div',{class:'mob-section-bar',id:'mob-sec-bar'});
  const MOB_SECTIONS=[
    {id:'personal',label:'👤 Info'},
    {id:'summary',label:'📝 Summary'},
    {id:'experience',label:'💼 Experience'},
    {id:'projects',label:'🗂️ Portfolio'},
    {id:'skills',label:'⚡ Skills'},
    {id:'education',label:'🎓 Education'},
    {id:'certifications',label:'🏅 Certs'},
    {id:'languages',label:'🌐 Languages'},
    {id:'achievements',label:'🏆 Achievements'},
    {id:'templates',label:'📄 Templates'},
    {id:'customize',label:'🎨 Style'},
    {id:'order',label:'🔃 Order'},
  ];
  MOB_SECTIONS.forEach(function(s){
    const btn=h('button',{class:'mob-section-btn'+(state.activeSection===s.id?' on':'')},s.label);
    btn.dataset.sid=s.id;
    on(btn,'click',function(){
      setState({activeSection:s.id,mobileTab:'editor'});
      edTab.classList.add('on');pvTab.classList.remove('on');
      updateMobNav('editor');
      btn.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
    });
    mobSecBar.appendChild(btn);
  });

  const main=h('div',{class:'main'},sidebar,editor,preview);
  app.appendChild(header);app.appendChild(mobTabs);app.appendChild(mobActionBar);app.appendChild(mobSecBar);app.appendChild(main);
}

// Boot
document.addEventListener('DOMContentLoaded',()=>{
  // Load from share link if present
  try{
    const hash=window.location.hash;
    if(hash&&hash.startsWith('#resume=')){
      const encoded=hash.slice(8);
      const json=decodeURIComponent(escape(atob(encoded)));
      const d=JSON.parse(json);
      if(d.resume){
        state.resume=d.resume;
        if(d.template)state.template=d.template;
        if(d.accent)state.accent=d.accent;
        if(d.font)state.font=d.font;
      }
      // Clean hash from URL
      history.replaceState(null,'',window.location.pathname+window.location.search);
    }
  }catch(e){console.warn('Could not load from share link:',e);}
  mount();
  rebuildEditorHeader();
  showOnboarding();
  // Push initial state to history
  pushHistory();
  scheduleSave();
});
</script>
